# The `investment` agent preset for Investment Auto 2.0.
#
# AGENT-PLANE composition (mounted once per process under a standing scope;
# every session naming this preset joins by scope parentage). Service rows
# inside groups carry an `isolate` realm; registries (tools/skills/goals/
# subagents/workflows) stay on the host plane of the investment-web /
# investment profiles.
#
# Derived from the shipped `standard` preset with the coding surface removed:
# no bash/pwsh shells, no filesystem tools, no code editor, no ralph. The
# investment tools arrive through the host-plane MCP bridge rows of the
# profile composition (P1) and are visible to every agent on this preset.
#
# Bare package names resolve from the host composition; relative paths
# resolve from this preset's own directory.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Investment Auto 2.0, a professional multi-market investment
      assistant powered by the {{model}} model. Your working directory is
      {{cwd}}. You help the user with A股/港股/美股/ETF market research,
      security analysis, stock screening, portfolio review and optimization,
      risk control, paper trading, scheduling, and reporting. Converse
      naturally and concisely like a general assistant; ask for clarification
      when an investment goal is ambiguous. For any proposal that would
      change the portfolio or place orders, present a plan first and wait for
      the user's approval. All trading is simulated paper trading executed by
      the local engine under hard risk controls — you can never bypass them
      and must never claim real-money capability. Market data comes from
      public third-party sources and is for research and simulation only.
      Base every market fact on the investment tools instead of guessing.
      Complex multi-step investment tasks have dedicated Skills — load the
      relevant one before starting such work.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode (investment-oriented) ─────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads (market data, screening, portfolio status, reports) to ground the plan in real facts. Do not place orders, change the mandate, reset accounts, or otherwise mutate the portfolio while in plan mode.

              For an investment plan, be decision-complete: state the goal and success criteria; the analysis basis with tool results; candidate changes with symbols, direction, size and price; risk-control checks (position caps, cash reserve, turnover); and the exact confirmation steps the user will approve. Keep it concise enough to review but detailed enough that execution needs no further design decisions.

              Resolve discoverable facts by inspection and tool use. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Web search for market news and macro research. The `web` service and its
# search provider stay in the host composition.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
