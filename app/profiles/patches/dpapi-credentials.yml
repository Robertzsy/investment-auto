# Investment Auto 2.0 — desktop patch overlay: DPAPI credentials.
#
# Applied by the desktop shell via `dsh --profile investment-web --patch <this
# file>` (and by the engine bridge for headless rounds): replaces the default
# `.credentials.yaml` provider with the DPAPI bridge, so API keys stay
# DPAPI-encrypted in the user data root. Development (dev.ps1) does NOT apply
# this overlay and keeps the default provider.
#
# Patch semantics note: a patch may NOT change a row's `name` (name mismatch
# skips the patch), so the default provider row is DISABLED and the DPAPI
# provider is INSERTED under its own id. Both rows never provide at once —
# the disabled base row mounts nothing, so the credentials service is served
# by the DPAPI bridge alone.
#
# engineUrl is a fallback only: the shell passes the real dynamic engine port
# through INVESTMENT_ENGINE_URL.
- id: credentials
  disabled: true

- insert:
    - id: credentials-dpapi
      name: '@investment-auto/dsh-dpapi-credentials'
      config:
        engineUrl: 'http://127.0.0.1:8790'
