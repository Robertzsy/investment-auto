<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment-Auto 仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e1e4e8;--text-dim:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--success:#3fb950;--danger:#f85149;--warning:#d29922;--radius:10px;--font:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 span{color:var(--accent)}
.nav{display:flex;gap:12px}
.nav a{color:var(--text-dim);text-decoration:none;font-size:0.9rem;padding:6px 12px;border-radius:6px;transition:all .15s}
.nav a:hover,.nav a.active{color:var(--text);background:rgba(88,166,255,0.1)}
.container{max-width:1400px;margin:0 auto;padding:20px}
/* Stats cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:0.8rem;color:var(--text-dim);margin-bottom:4px}
.stat-card .value{font-size:1.4rem;font-weight:700}
.stat-card .sub{font-size:0.75rem;color:var(--text-dim);margin-top:4px}
.stat-card .value.positive{color:var(--success)}
.stat-card .value.negative{color:var(--danger)}
/* Grid layout */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h3{font-size:0.95rem;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;gap:6px}
.card canvas{max-height:250px}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:0.85rem}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left}
th{background:rgba(88,166,255,0.1);font-weight:600}
tr:hover{background:rgba(88,166,255,0.05)}
/* Market tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:0.9rem;color:var(--text-dim);transition:all .15s}
.tab:hover,.tab.active{border-color:var(--accent);color:var(--text)}
.tab.active{background:rgba(88,166,255,0.1)}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-size:0.9rem}
/* Refresh */
.refresh-btn{background:var(--border);color:var(--text);border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.8rem;margin-left:auto}
.refresh-btn:hover{background:var(--accent)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-header h3{margin-bottom:0}
</style>
</head>
<body>
<div class="header">
  <h1>📊 <span>Investment-Auto</span> 仪表盘</h1>
  <div class="nav">
    <a href="/">💬 对话</a>
    <a href="/dashboard" class="active">📊 仪表盘</a>
    <a href="/macro">📰 宏观日报</a>
    <a href="/settings">⚙️ 设置</a>
  </div>
</div>

<div class="container">
  <!-- 总览统计 -->
  <div class="stats" id="statsCards">
    <div class="stat-card"><div class="label">总资产</div><div class="value" id="totalAssets">-</div><div class="sub">全部市场合计</div></div>
    <div class="stat-card"><div class="label">今日收益</div><div class="value" id="todayPnl">-</div><div class="sub" id="todayPnlPct">-</div></div>
    <div class="stat-card"><div class="label">持仓数量</div><div class="value" id="totalPositions">-</div><div class="sub">全部市场</div></div>
    <div class="stat-card"><div class="label">现金比例</div><div class="value" id="cashRatio">-</div><div class="sub">可用资金</div></div>
    <div class="stat-card"><div class="label">启用市场</div><div class="value" id="enabledMarkets">-</div><div class="sub">当前配置</div></div>
  </div>

  <!-- 市场选择 -->
  <div class="tabs" id="marketTabs">
    <div class="tab active" data-market="all">全部</div>
    <div class="tab" data-market="cn">🇨🇳 A股</div>
    <div class="tab" data-market="hk">🇭🇰 港股</div>
    <div class="tab" data-market="us">🇺🇸 美股</div>
    <div class="tab" data-market="etf">📊 ETF</div>
  </div>

  <!-- 图表区域 -->
  <div class="grid">
    <div class="card">
      <div class="card-header"><h3>📈 资产分布</h3><button class="refresh-btn" onclick="loadDashboard()">刷新</button></div>
      <canvas id="assetChart"></canvas>
    </div>
    <div class="card">
      <div class="card-header"><h3>💰 现金 vs 持仓</h3></div>
      <canvas id="cashChart"></canvas>
    </div>
    <div class="card">
      <div class="card-header"><h3>📊 持仓权重</h3></div>
      <canvas id="weightChart"></canvas>
    </div>
    <div class="card">
      <div class="card-header"><h3>📉 优化器对比</h3></div>
      <canvas id="optimizerChart"></canvas>
    </div>
  </div>

  <!-- 宏观日报区域 -->
  <div class="card" style="margin-top:16px">
    <div class="card-header"><h3>📰 宏观日报</h3><a href="/macro" style="color:var(--accent);font-size:0.85rem;text-decoration:none">查看全部 →</a></div>
    <div id="macroSummary"><div class="loading">加载中...</div></div>
  </div>

  <!-- 持仓明细 -->
  <div class="card">
    <div class="card-header"><h3>📋 持仓明细</h3><button class="refresh-btn" onclick="loadDashboard()">刷新</button></div>
    <div id="holdingsTable"><div class="loading">加载中...</div></div>
  </div>

  <!-- 最近交易 -->
  <div class="card" style="margin-top:16px">
    <div class="card-header"><h3>📝 最近交易</h3></div>
    <div id="tradesTable"><div class="loading">加载中...</div></div>
  </div>

  <!-- 优化器结果 -->
  <div class="card" style="margin-top:16px">
    <div class="card-header"><h3>🔬 最新优化器结果</h3></div>
    <div id="optimizerResult"><div class="loading">加载中...</div></div>
  </div>
</div>

<script>
let currentMarket = 'all';
let charts = {};

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMarket = tab.dataset.market;
    loadDashboard();
  });
});

async function loadDashboard() {
  try {
    const res = await fetch('/api/dashboard?market=' + currentMarket);
    const data = await res.json();
    renderStats(data);
    renderCharts(data);
    renderHoldings(data);
    renderTrades(data);
    renderOptimizer(data);
    loadMacroSummary();
  } catch(e) {
    console.error(e);
    document.getElementById('holdingsTable').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
  }
}

async function loadMacroSummary() {
  try {
    const res = await fetch('/api/macro/dates');
    const data = await res.json();
    const container = document.getElementById('macroSummary');
    if (!data.dates || data.dates.length === 0) {
      container.innerHTML = '<div class="empty">暂无宏观数据</div>';
      return;
    }
    // Show latest 3 dates
    let html = '<div style="display:flex;flex-direction:column;gap:8px">';
    data.dates.slice(0, 3).forEach(date => {
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg);border-radius:6px">
        <span>${date}</span>
        <a href="/macro" style="color:var(--accent);font-size:0.8rem;text-decoration:none">查看 →</a>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e) {
    document.getElementById('macroSummary').innerHTML = '<div class="empty">加载失败</div>';
  }
}

function renderStats(data) {
  const s = data.stats || {};
  document.getElementById('totalAssets').textContent = formatMoney(s.total_assets);
  const pnl = s.today_pnl || 0;
  const pnlEl = document.getElementById('todayPnl');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + formatMoney(pnl);
  pnlEl.className = 'value ' + (pnl >= 0 ? 'positive' : 'negative');
  document.getElementById('todayPnlPct').textContent = (s.today_pnl_pct >= 0 ? '+' : '') + (s.today_pnl_pct || 0).toFixed(2) + '%';
  document.getElementById('totalPositions').textContent = s.total_positions || 0;
  document.getElementById('cashRatio').textContent = (s.cash_ratio || 0).toFixed(1) + '%';
  document.getElementById('enabledMarkets').textContent = (s.enabled_markets || []).join(', ');
}

function renderCharts(data) {
  // 销毁旧图表
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  // 资产分布饼图
  const assetCtx = document.getElementById('assetChart').getContext('2d');
  charts.asset = new Chart(assetCtx, {
    type: 'doughnut',
    data: {
      labels: data.asset_distribution?.labels || [],
      datasets: [{
        data: data.asset_distribution?.values || [],
        backgroundColor: ['#58a6ff','#3fb950','#d29922','#f85149','#a371f7']
      }]
    },
    options: {responsive: true, plugins: {legend: {labels: {color: '#e1e4e8'}}}}
  });

  // 现金 vs 持仓
  const cashCtx = document.getElementById('cashChart').getContext('2d');
  charts.cash = new Chart(cashCtx, {
    type: 'bar',
    data: {
      labels: data.cash_vs_holdings?.labels || [],
      datasets: [
        {label: '现金', data: data.cash_vs_holdings?.cash || [], backgroundColor: '#58a6ff'},
        {label: '持仓', data: data.cash_vs_holdings?.holdings || [], backgroundColor: '#3fb950'}
      ]
    },
    options: {responsive: true, scales: {x: {ticks: {color: '#e1e4e8'}}, y: {ticks: {color: '#e1e4e8'}}}, plugins: {legend: {labels: {color: '#e1e4e8'}}}}
  });

  // 持仓权重
  const weightCtx = document.getElementById('weightChart').getContext('2d');
  charts.weight = new Chart(weightCtx, {
    type: 'pie',
    data: {
      labels: data.weight_distribution?.labels || [],
      datasets: [{
        data: data.weight_distribution?.values || [],
        backgroundColor: ['#58a6ff','#3fb950','#d29922','#f85149','#a371f7','#79c0ff','#56d4dd','#e3b341']
      }]
    },
    options: {responsive: true, plugins: {legend: {labels: {color: '#e1e4e8'}}}}
  });

  // 优化器对比
  const optCtx = document.getElementById('optimizerChart').getContext('2d');
  charts.optimizer = new Chart(optCtx, {
    type: 'radar',
    data: {
      labels: ['年化收益', '夏普比率', '最大回撤', 'VaR95', '换手率'],
      datasets: data.optimizer_comparison || []
    },
    options: {responsive: true, scales: {r: {ticks: {color: '#e1e4e8'}, grid: {color: '#2a2d3a'}, angleLines: {color: '#2a2d3a'}, pointLabels: {color: '#e1e4e8'}}}, plugins: {legend: {labels: {color: '#e1e4e8'}}}}
  });
}

function renderHoldings(data) {
  const holdings = data.holdings || [];
  if (holdings.length === 0) {
    document.getElementById('holdingsTable').innerHTML = '<div class="empty">暂无持仓</div>';
    return;
  }
  let html = '<table><tr><th>市场</th><th>代码</th><th>名称</th><th>持仓</th><th>成本</th><th>现价</th><th>市值</th><th>盈亏</th><th>盈亏%</th></tr>';
  holdings.forEach(h => {
    const pnl = (h.last_price - h.cost_price) * h.shares;
    const pnlPct = ((h.last_price / h.cost_price - 1) * 100).toFixed(2);
    const cls = pnl >= 0 ? 'positive' : 'negative';
    html += `<tr><td>${h.market}</td><td>${h.code}</td><td>${h.name}</td><td>${h.shares}</td><td>${h.cost_price}</td><td>${h.last_price}</td><td>${formatMoney(h.market_value)}</td><td class="${cls}">${formatMoney(pnl)}</td><td class="${cls}">${pnlPct}%</td></tr>`;
  });
  html += '</table>';
  document.getElementById('holdingsTable').innerHTML = html;
}

function renderTrades(data) {
  const trades = data.recent_trades || [];
  if (trades.length === 0) {
    document.getElementById('tradesTable').innerHTML = '<div class="empty">暂无交易记录</div>';
    return;
  }
  let html = '<table><tr><th>日期</th><th>市场</th><th>代码</th><th>名称</th><th>操作</th><th>数量</th><th>价格</th><th>金额</th></tr>';
  trades.slice(-10).reverse().forEach(t => {
    html += `<tr><td>${t.date}</td><td>${t.market}</td><td>${t.code}</td><td>${t.name}</td><td>${t.action}</td><td>${t.shares}</td><td>${t.price}</td><td>${formatMoney(t.amount)}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('tradesTable').innerHTML = html;
}

function renderOptimizer(data) {
  const opt = data.optimizer || {};
  if (!opt.available) {
    document.getElementById('optimizerResult').innerHTML = '<div class="empty">暂无优化器结果</div>';
    return;
  }
  let html = '<table><tr><th>方案</th><th>年化收益</th><th>年化波动</th><th>夏普</th><th>VaR95</th><th>最大回撤</th></tr>';
  for (const [name, m] of Object.entries(opt.schemes || {})) {
    html += `<tr><td>${name}</td><td>${(m.annual_return*100).toFixed(2)}%</td><td>${(m.annual_volatility*100).toFixed(2)}%</td><td>${m.sharpe?.toFixed(3)}</td><td>${(m.var95*100).toFixed(2)}%</td><td>${(m.max_drawdown*100).toFixed(2)}%</td></tr>`;
  }
  html += '</table>';
  document.getElementById('optimizerResult').innerHTML = html;
}

function formatMoney(v) {
  if (v === null || v === undefined) return '-';
  return '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

loadDashboard();
</script>
</body>
</html>
