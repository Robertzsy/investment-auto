<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment-Auto 设置</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e1e4e8;--text-dim:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--success:#3fb950;--danger:#f85149;--warning:#d29922;--radius:10px;--font:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 span{color:var(--accent)}
.nav{display:flex;gap:12px}
.nav a{color:var(--text-dim);text-decoration:none;font-size:0.9rem;padding:6px 12px;border-radius:6px;transition:all .15s}
.nav a:hover,.nav a.active{color:var(--text);background:rgba(88,166,255,0.1)}
.container{max-width:900px;margin:0 auto;padding:20px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.section h2{font-size:1rem;margin-bottom:16px;color:var(--accent);display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:0.85rem;color:var(--text-dim);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 12px;font-size:0.9rem;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group input[type=password]{font-family:monospace}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px}
.checkbox-item{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer;transition:all .15s}
.checkbox-item:hover{border-color:var(--accent)}
.checkbox-item input{accent-color:var(--accent)}
.time-list{display:flex;flex-direction:column;gap:8px}
.time-item{display:flex;gap:8px;align-items:center}
.time-item input{flex:1}
.time-item button{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:0.8rem}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-weight:600;font-size:0.9rem;transition:background .15s}
.btn:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--text-dim)}
.btn-success{background:var(--success)}
.btn-success:hover{opacity:0.9}
.add-btn{background:var(--border);color:var(--text);border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.8rem}
.add-btn:hover{background:var(--accent)}
.save-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:12px;justify-content:flex-end}
.toast{position:fixed;top:20px;right:20px;background:var(--success);color:#fff;padding:12px 20px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;z-index:1000}
.toast.show{opacity:1}
.toast.error{background:var(--danger)}
/* API Key 卡片 */
.api-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.api-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.api-card-header h3{font-size:0.95rem;color:var(--text)}
.api-card-header .status{font-size:0.75rem;padding:2px 8px;border-radius:10px}
.api-card-header .status.configured{background:var(--success);color:#fff}
.api-card-header .status.not-configured{background:var(--border);color:var(--text-dim)}
.api-card .form-group{margin-bottom:8px}
.api-card .form-group:last-child{margin-bottom:0}
.help-text{font-size:0.75rem;color:var(--text-dim);margin-top:4px}
.section-note{font-size:0.82rem;line-height:1.6;color:var(--text-dim);margin:-6px 0 16px;padding:10px 12px;background:rgba(88,166,255,0.07);border-left:3px solid var(--accent);border-radius:4px}
.rule-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.rule-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px}
.rule-item span{display:block;font-size:0.72rem;color:var(--text-dim);margin-bottom:4px}
.rule-item strong{font-size:0.88rem;color:var(--text)}
.subheading{font-size:0.88rem;font-weight:600;color:var(--text);margin:4px 0 12px}
/* 模型选择简化 */
.model-select-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.model-option{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;text-align:center}
.model-option:hover{border-color:var(--accent)}
.model-option.selected{border-color:var(--accent);background:rgba(88,166,255,0.1)}
.model-option .name{font-weight:600;margin-bottom:4px}
.model-option .desc{font-size:0.75rem;color:var(--text-dim)}
</style>
</head>
<body>
<div class="header">
  <h1>⚙️ <span>Investment-Auto</span> 设置</h1>
  <div class="nav">
    <a href="/">💬 对话</a>
    <a href="/dashboard">📊 仪表盘</a>
    <a href="/settings" class="active">⚙️ 设置</a>
  </div>
</div>

<div class="container">
  <!-- API Keys -->
  <div class="section">
    <h2>🔑 API Keys</h2>
    <div id="apiKeysContainer"></div>
  </div>

  <!-- 模型选择 -->
  <div class="section">
    <h2>🤖 AI 模型</h2>
    <div class="form-group">
      <label>主模型（点击选择）</label>
      <div class="model-select-group" id="modelSelectGroup"></div>
    </div>
    <div class="form-group">
      <label>回退顺序（用逗号分隔，如: openai,glm,kimi）</label>
      <input type="text" id="llmFallback" placeholder="openai,glm,kimi">
      <div class="help-text">当主模型失败时，按此顺序尝试其他模型</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>快速模型（分析师/研究员）</label>
        <select id="quickModel"></select>
      </div>
      <div class="form-group">
        <label>专业模型（裁决/交易/风控）</label>
        <select id="proModel"></select>
      </div>
    </div>
    <button class="add-btn" onclick="addProvider()">+ 添加模型供应商</button>
  </div>

  <!-- 市场开关 -->
  <div class="section">
    <h2>🌐 市场开关</h2>
    <div class="form-group">
      <label>启用市场（可多选）</label>
      <div class="checkbox-group" id="marketCheckboxes">
        <label class="checkbox-item"><input type="checkbox" value="cn"> 🇨🇳 A股</label>
        <label class="checkbox-item"><input type="checkbox" value="hk"> 🇭🇰 港股</label>
        <label class="checkbox-item"><input type="checkbox" value="us"> 🇺🇸 美股</label>
        <label class="checkbox-item"><input type="checkbox" value="etf"> 📊 ETF</label>
      </div>
    </div>
  </div>

  <!-- 调度设置 -->
  <div class="section">
    <h2>⏰ 调度设置</h2>
    <div class="form-row">
      <div class="form-group">
        <label>时区</label>
        <input type="text" id="timezone" value="Asia/Shanghai">
      </div>
      <div class="form-group">
        <label>仅工作日运行</label>
        <select id="weekdaysOnly">
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
    </div>
    <div id="intradaySettings"></div>
  </div>

  <!-- 优化器设置 -->
  <div class="section">
    <h2>📈 组合优化</h2>
    <div class="form-row">
      <div class="form-group">
        <label>启用优化器</label>
        <select id="optimizerEnabled">
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
      <div class="form-group">
        <label>回看天数</label>
        <input type="number" id="lookbackDays" value="120">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>无风险利率</label>
        <input type="number" id="riskFreeRate" value="0.02" step="0.01">
      </div>
      <div class="form-group">
        <label>成本感知</label>
        <select id="costAware">
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
    </div>
  </div>

  <!-- AI 自主交易 -->
  <div class="section">
    <h2>🤖 AI 自主交易</h2>
    <div class="section-note">这些是全局硬上限。即使 AI 给出更激进的建议，也不能突破这里的仓位、金额、换手和频次限制。</div>
    <div class="form-row">
      <div class="form-group">
        <label>启用自主决策</label>
        <select id="autonomousEnabled">
          <option value="true">启用</option>
          <option value="false">停用</option>
        </select>
      </div>
      <div class="form-group">
        <label>自动执行模拟订单</label>
        <select id="autoExecute">
          <option value="true">自动执行</option>
          <option value="false">仅生成决策，不下单</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>最低决策置信度（0-1）</label>
        <input type="number" id="minConfidence" min="0" max="1" step="0.05">
      </div>
      <div class="form-group">
        <label>单轮最大订单数</label>
        <input type="number" id="maxOrdersPerCycle" min="0" step="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>单标的最大仓位（%）</label>
        <input type="number" id="maxPositionPct" min="0" max="100" step="0.5">
      </div>
      <div class="form-group">
        <label>单笔最大金额占总资产（%）</label>
        <input type="number" id="maxOrderValuePct" min="0" max="100" step="0.5">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>单轮最大换手（%）</label>
        <input type="number" id="maxCycleTurnoverPct" min="0" max="100" step="0.5">
      </div>
      <div class="form-group">
        <label>补跑轮次允许交易</label>
        <select id="tradeOnCatchUp">
          <option value="false">否，仅记录补跑结果</option>
          <option value="true">是，允许补跑下单</option>
        </select>
      </div>
    </div>
    <div class="subheading">AI 可交易标的（留空则使用优化器默认标的）</div>
    <div class="form-row">
      <div class="form-group"><label>A 股</label><input type="text" id="universe_cn" placeholder="600519, 000858, 510300"></div>
      <div class="form-group"><label>港股</label><input type="text" id="universe_hk" placeholder="00700, 09988, 02800"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>美股</label><input type="text" id="universe_us" placeholder="AAPL, MSFT, SPY"></div>
      <div class="form-group"><label>ETF</label><input type="text" id="universe_etf" placeholder="510300, 510050, 159915"></div>
    </div>
  </div>

  <!-- 分市场风控 -->
  <div class="section">
    <h2>🛡️ 分市场风控</h2>
    <div class="section-note">止损、止盈、现金储备和最大回撤按市场分别生效。手续费、印花税、滑点、整手和结算制度是模拟撮合规则，只展示、不在这里修改。</div>
    <div class="form-group">
      <label>编辑市场</label>
      <select id="riskMarket" onchange="switchMarketRisk()">
        <option value="cn">A 股</option>
        <option value="hk">港股</option>
        <option value="us">美股</option>
        <option value="etf">ETF</option>
      </select>
    </div>
    <div class="rule-strip">
      <div class="rule-item"><span>结算</span><strong id="ruleSettlement">-</strong></div>
      <div class="rule-item"><span>整手</span><strong id="ruleLotSize">-</strong></div>
      <div class="rule-item"><span>佣金率</span><strong id="ruleCommission">-</strong></div>
      <div class="rule-item"><span>印花税</span><strong id="ruleStampTax">-</strong></div>
      <div class="rule-item"><span>滑点</span><strong id="ruleSlippage">-</strong></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>市场内单标的最大仓位（%）</label><input type="number" id="singleStockMaxPct" min="1" max="100" step="0.5"></div>
      <div class="form-group"><label>最低现金储备（%）</label><input type="number" id="minCashReservePct" min="0" max="100" step="0.5"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>硬止损（%，负数）</label><input type="number" id="hardStopPct" min="-100" max="0" step="0.5"></div>
      <div class="form-group"><label>移动止损回撤（%，负数）</label><input type="number" id="trailingStopPct" min="-100" max="0" step="0.5"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>第一档止盈（%）</label><input type="number" id="takeProfit1Pct" min="0" step="0.5"></div>
      <div class="form-group"><label>第一档卖出比例（0-1）</label><input type="number" id="takeProfit1SellRatio" min="0" max="1" step="0.05"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>第二档止盈（%）</label><input type="number" id="takeProfit2Pct" min="0" step="0.5"></div>
      <div class="form-group"><label>第二档卖出比例（0-1）</label><input type="number" id="takeProfit2SellRatio" min="0" max="1" step="0.05"></div>
    </div>
    <div class="form-group">
      <label>账户最大回撤强制清仓线（%，负数）</label>
      <input type="number" id="maxDrawdownPct" min="-100" max="0" step="0.5">
    </div>
  </div>

  <!-- 交易设置 -->
  <div class="section">
    <h2>💰 交易</h2>
    <div class="form-row">
      <div class="form-group">
        <label>模式</label>
        <select id="tradingMode">
          <option value="paper">模拟盘</option>
          <option value="live">实盘（预留）</option>
        </select>
      </div>
      <div class="form-group">
        <label>日最大交易笔数</label>
        <input type="number" id="maxDailyTrades" value="6">
      </div>
    </div>
  </div>
</div>

<div class="save-bar">
  <button class="btn btn-secondary" onclick="loadConfig()">🔄 重置</button>
  <button class="btn btn-success" onclick="saveConfig()">💾 保存配置</button>
</div>

<div class="toast" id="toast"></div>

<script>
let config = {};
let envVars = {};
let marketConfigs = {};
let currentRiskMarket = 'cn';

const DEFAULT_PROVIDERS = {
  deepseek: { name: 'DeepSeek', desc: '深度求索 V4', defaultModel: 'deepseek-v4-pro', defaultBase: 'https://api.deepseek.com' },
  openai: { name: 'OpenAI/MUST中转', desc: 'GPT-5.6 / 学校中转站', defaultModel: 'gpt-5.5', defaultBase: 'https://ai-apigateway.must.edu.mo/openhub/v1' },
  glm: { name: 'GLM', desc: '智谱 5.2', defaultModel: 'glm-5.2', defaultBase: 'https://open.bigmodel.cn/api/paas/v4' },
  kimi: { name: 'Kimi', desc: '月之暗面 K3', defaultModel: 'kimi-k3', defaultBase: 'https://api.moonshot.cn/v1' }
};
function providers() {
  const out = {...DEFAULT_PROVIDERS};
  for (const [k,v] of Object.entries(config.llm?.models || {})) {
    if (!out[k]) out[k] = {name:k, desc:'自定义模型供应商', defaultModel:v.model || '', defaultBase:v.api_base || ''};
  }
  return out;
}

async function loadConfig() {
  try {
    const [configRes, envRes, marketConfigRes] = await Promise.all([
      fetch('/api/config'),
      fetch('/api/env'),
      fetch('/api/market-configs')
    ]);
    if (!configRes.ok || !envRes.ok || !marketConfigRes.ok) throw new Error('配置接口返回异常');
    config = await configRes.json();
    envVars = await envRes.json();
    marketConfigs = await marketConfigRes.json();
    renderConfig();
    showToast('配置已加载', 'success');
  } catch(e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

function renderConfig() {
  renderApiKeys();
  renderModelSelect();
  renderRoleModels();
  
  // 市场开关
  const markets = config.markets?.enable || [];
  document.querySelectorAll('#marketCheckboxes input').forEach(cb => {
    cb.checked = markets.includes(cb.value);
  });

  // 调度
  document.getElementById('timezone').value = config.schedule?.timezone || 'Asia/Shanghai';
  document.getElementById('weekdaysOnly').value = String(config.schedule?.weekdays_only ?? true);
  renderIntraday();

  // LLM
  document.getElementById('llmFallback').value = (config.llm?.provider_fallback || []).join(',');

  // 优化器
  document.getElementById('optimizerEnabled').value = String(config.optimizer?.enabled ?? true);
  document.getElementById('lookbackDays').value = config.optimizer?.lookback_days || 120;
  document.getElementById('riskFreeRate').value = config.optimizer?.risk_free_rate || 0.02;
  document.getElementById('costAware').value = String(config.optimizer?.cost_aware ?? true);

  // AI 自主交易
  const autonomy = config.autonomous || {};
  document.getElementById('autonomousEnabled').value = String(autonomy.enabled ?? false);
  document.getElementById('autoExecute').value = String(autonomy.auto_execute ?? true);
  document.getElementById('tradeOnCatchUp').value = String(autonomy.trade_on_catch_up ?? false);
  document.getElementById('minConfidence').value = autonomy.min_confidence ?? 0.65;
  document.getElementById('maxOrdersPerCycle').value = autonomy.max_orders_per_cycle ?? 3;
  document.getElementById('maxPositionPct').value = autonomy.max_position_pct ?? 12;
  document.getElementById('maxOrderValuePct').value = autonomy.max_order_value_pct ?? 8;
  document.getElementById('maxCycleTurnoverPct').value = autonomy.max_cycle_turnover_pct ?? 15;
  for (const market of ['cn', 'hk', 'us', 'etf']) {
    document.getElementById('universe_' + market).value = (autonomy.universe?.[market] || []).join(', ');
  }

  renderMarketRisk();

  // 交易
  document.getElementById('tradingMode').value = config.trading?.mode || 'paper';
  document.getElementById('maxDailyTrades').value = config.trading?.max_daily_trades || 6;
}

function renderMarketRisk() {
  const market = document.getElementById('riskMarket').value;
  const marketConfig = marketConfigs[market] || {};
  const risk = marketConfig.risk || {};
  const rules = marketConfig.rules || {};
  document.getElementById('ruleSettlement').textContent = rules.settlement ?? '-';
  document.getElementById('ruleLotSize').textContent = rules.lot_size ?? '-';
  document.getElementById('ruleCommission').textContent = formatRate(rules.commission_rate);
  document.getElementById('ruleStampTax').textContent = formatRate(rules.stamp_tax);
  document.getElementById('ruleSlippage').textContent = formatRate(rules.slippage);
  document.getElementById('singleStockMaxPct').value = risk.single_stock_max_pct ?? '';
  document.getElementById('minCashReservePct').value = risk.min_cash_reserve_pct ?? '';
  document.getElementById('hardStopPct').value = risk.hard_stop_pct ?? '';
  document.getElementById('trailingStopPct').value = risk.trailing_stop_pct ?? '';
  document.getElementById('takeProfit1Pct').value = risk.take_profit_1_pct ?? '';
  document.getElementById('takeProfit1SellRatio').value = risk.take_profit_1_sell_ratio ?? '';
  document.getElementById('takeProfit2Pct').value = risk.take_profit_2_pct ?? '';
  document.getElementById('takeProfit2SellRatio').value = risk.take_profit_2_sell_ratio ?? '';
  document.getElementById('maxDrawdownPct').value = risk.max_drawdown_pct ?? '';
}

function switchMarketRisk() {
  collectCurrentMarketRisk(currentRiskMarket);
  currentRiskMarket = document.getElementById('riskMarket').value;
  renderMarketRisk();
}

function formatRate(value) {
  return typeof value === 'number' ? (value * 100).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '%' : '-';
}

function collectCurrentMarketRisk(market = currentRiskMarket) {
  marketConfigs[market] = marketConfigs[market] || {};
  marketConfigs[market].risk = {
    single_stock_max_pct: parseFloat(document.getElementById('singleStockMaxPct').value),
    min_cash_reserve_pct: parseFloat(document.getElementById('minCashReservePct').value),
    hard_stop_pct: parseFloat(document.getElementById('hardStopPct').value),
    trailing_stop_pct: parseFloat(document.getElementById('trailingStopPct').value),
    take_profit_1_pct: parseFloat(document.getElementById('takeProfit1Pct').value),
    take_profit_1_sell_ratio: parseFloat(document.getElementById('takeProfit1SellRatio').value),
    take_profit_2_pct: parseFloat(document.getElementById('takeProfit2Pct').value),
    take_profit_2_sell_ratio: parseFloat(document.getElementById('takeProfit2SellRatio').value),
    max_drawdown_pct: parseFloat(document.getElementById('maxDrawdownPct').value)
  };
}

function validateTradingControls() {
  const ids = [
    'minConfidence', 'maxOrdersPerCycle', 'maxPositionPct', 'maxOrderValuePct',
    'maxCycleTurnoverPct', 'singleStockMaxPct', 'minCashReservePct',
    'hardStopPct', 'trailingStopPct', 'takeProfit1Pct', 'takeProfit1SellRatio',
    'takeProfit2Pct', 'takeProfit2SellRatio', 'maxDrawdownPct', 'maxDailyTrades'
  ];
  for (const id of ids) {
    const input = document.getElementById(id);
    if (input.value === '' || !input.checkValidity() || !Number.isFinite(Number(input.value))) {
      showToast('❌ 请检查“' + input.closest('.form-group').querySelector('label').textContent + '”', 'error');
      input.focus();
      return false;
    }
  }
  if (Number(document.getElementById('takeProfit2Pct').value) < Number(document.getElementById('takeProfit1Pct').value)) {
    showToast('❌ 第二档止盈不能低于第一档', 'error');
    document.getElementById('takeProfit2Pct').focus();
    return false;
  }
  return true;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[ch]);
}

function renderApiKeys() {
  const container = document.getElementById('apiKeysContainer');
  container.innerHTML = '';
  
  for (const [key, info] of Object.entries(providers())) {
    const envKey = (config.llm?.models?.[key]?.api_key_env) || (key.toUpperCase() + '_API_KEY');
    const hasKey = Boolean(envVars[envKey]);
    const currentModel = config.llm?.models?.[key]?.model || info.defaultModel;
    const currentBase = config.llm?.models?.[key]?.api_base || info.defaultBase;
    const safeKey = escapeHtml(key);
    const safeName = escapeHtml(info.name);
    const safeModel = escapeHtml(currentModel);
    const safeBase = escapeHtml(currentBase);
    const safeDefaultModel = escapeHtml(info.defaultModel);
    const safeDescription = escapeHtml(info.desc);
    
    const div = document.createElement('div');
    div.className = 'api-card';
    div.innerHTML = `
      <div class="api-card-header">
        <h3>${safeName}</h3>
        <span class="status ${hasKey ? 'configured' : 'not-configured'}">${hasKey ? '已配置' : '未配置'}</span>
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apikey_${safeKey}" value="" autocomplete="new-password" placeholder="留空以保持当前 API Key">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>模型</label>
          <input type="text" id="model_${safeKey}" value="${safeModel}" placeholder="${safeDefaultModel}">
        </div>
        <div class="form-group">
          <label>API 地址</label>
          <input type="text" id="base_${safeKey}" value="${safeBase}" placeholder="${escapeHtml(info.defaultBase)}">
        </div>
      </div>
      <div class="help-text">${safeDescription} · 默认模型: ${safeDefaultModel}</div>
    `;
    container.appendChild(div);
  }
}

function renderModelSelect() {
  const container = document.getElementById('modelSelectGroup');
  const currentProvider = config.llm?.provider || 'deepseek';
  container.innerHTML = '';
  
  for (const [key, info] of Object.entries(providers())) {
    const div = document.createElement('div');
    div.className = 'model-option' + (key === currentProvider ? ' selected' : '');
    div.dataset.provider = key;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = info.name;
    const description = document.createElement('div');
    description.className = 'desc';
    description.textContent = info.desc;
    div.append(name, description);
    div.onclick = () => {
      document.querySelectorAll('.model-option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
    };
    container.appendChild(div);
  }
}

function allModelNames() {
  const names = [];
  for (const [provider, cfg] of Object.entries(config.llm?.models || {})) {
    const variants = [...new Set([cfg.model, ...(cfg.variants || [])].filter(Boolean))];
    variants.forEach(v => names.push(v));
  }
  return [...new Set(names)];
}

function renderRoleModels() {
  const names = allModelNames();
  const quick = document.getElementById('quickModel');
  const pro = document.getElementById('proModel');
  quick.innerHTML = '';
  pro.innerHTML = '';
  names.forEach(n => {
    const o1 = document.createElement('option'); o1.value=n; o1.textContent=n; quick.appendChild(o1);
    const o2 = document.createElement('option'); o2.value=n; o2.textContent=n; pro.appendChild(o2);
  });
  const roleMap = config.llm?.role_model_override || {};
  quick.value = roleMap.analyst || roleMap.researcher || names[0] || '';
  pro.value = roleMap.judge || roleMap.trader || roleMap.risk_chairman || names[0] || '';
}

function addProvider() {
  const key = prompt('输入供应商标识（英文小写，例如 qwen、openrouter）');
  if (!key) return;
  const provider = key.trim().toLowerCase();
  if (!provider) return;
  config.llm = config.llm || {}; config.llm.models = config.llm.models || {};
  if (config.llm.models[provider]) { alert('供应商已存在'); return; }
  config.llm.models[provider] = {
    model: prompt('默认模型名', '') || '',
    api_base: prompt('API Base URL', 'https://') || '',
    variants: [],
    api_key_env: provider.toUpperCase() + '_API_KEY'
  };
  renderApiKeys(); renderModelSelect(); renderRoleModels();
}

function renderIntraday() {
  const container = document.getElementById('intradaySettings');
  const rounds = config.schedule?.intraday_rounds || {};
  container.innerHTML = '';
  for (const [market, times] of Object.entries(rounds)) {
    const div = document.createElement('div');
    div.className = 'form-group';
    const label = document.createElement('label');
    label.textContent = `${market.toUpperCase()} 盘中轮次`;
    const list = document.createElement('div');
    list.className = 'time-list';
    list.id = `times-${market}`;
    const addButton = document.createElement('button');
    addButton.className = 'add-btn';
    addButton.textContent = '+ 添加时间';
    addButton.onclick = () => addTime(market);
    div.append(label, list, addButton);
    container.appendChild(div);
    times.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'time-item';
      const input = document.createElement('input');
      input.type = 'time';
      input.value = t;
      input.dataset.market = market;
      input.dataset.index = String(i);
      const removeButton = document.createElement('button');
      removeButton.textContent = '删除';
      removeButton.onclick = () => removeTime(market, i);
      item.append(input, removeButton);
      list.appendChild(item);
    });
  }
}

function addTime(market) {
  if (!config.schedule.intraday_rounds[market]) config.schedule.intraday_rounds[market] = [];
  config.schedule.intraday_rounds[market].push('10:00');
  renderIntraday();
}

function removeTime(market, index) {
  config.schedule.intraday_rounds[market].splice(index, 1);
  renderIntraday();
}

async function saveConfig() {
  if (!validateTradingControls()) return;

  // 收集 API Keys
  const newEnv = {};
  for (const key of Object.keys(providers())) {
    const envKey = (config.llm?.models?.[key]?.api_key_env) || (key.toUpperCase() + '_API_KEY');
    const value = document.getElementById(`apikey_${key}`).value;
    if (value) newEnv[envKey] = value;
  }
  
  // 保存到 .env
  try {
    await fetch('/api/env', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(newEnv)
    });
  } catch(e) {
    showToast('⚠️ API Keys 保存失败: ' + e.message, 'error');
  }

  // 收集模型配置
  const selectedProvider = document.querySelector('.model-option.selected')?.dataset.provider || 'deepseek';
  config.llm = config.llm || {};
  config.llm.provider = selectedProvider;
  config.llm.provider_fallback = document.getElementById('llmFallback').value.split(',').map(s=>s.trim()).filter(Boolean);
  
  // 更新各 provider 的 model 和 base
  config.llm.models = config.llm.models || {};
  for (const key of Object.keys(providers())) {
    config.llm.models[key] = config.llm.models[key] || {};
    config.llm.models[key].model = document.getElementById(`model_${key}`).value;
    config.llm.models[key].api_base = document.getElementById(`base_${key}`).value;
    if (!config.llm.models[key].api_key_env) config.llm.models[key].api_key_env = key.toUpperCase() + '_API_KEY';
    const m = config.llm.models[key].model;
    const variants = config.llm.models[key].variants || [];
    if (m && !variants.includes(m)) variants.unshift(m);
    config.llm.models[key].variants = variants;
  }
  // 快速/专业模型映射
  const quickModel = document.getElementById('quickModel').value;
  const proModel = document.getElementById('proModel').value;
  config.llm.role_model_override = config.llm.role_model_override || {};
  config.llm.role_model_override.analyst = quickModel;
  config.llm.role_model_override.researcher = quickModel;
  config.llm.role_model_override.quant_analyst = proModel;
  config.llm.role_model_override.judge = proModel;
  config.llm.role_model_override.trader = proModel;
  config.llm.role_model_override.risk_chairman = proModel;

  // 市场开关
  const markets = [];
  document.querySelectorAll('#marketCheckboxes input:checked').forEach(cb => markets.push(cb.value));
  config.markets = config.markets || {};
  config.markets.enable = markets;

  // 调度
  config.schedule = config.schedule || {};
  config.schedule.timezone = document.getElementById('timezone').value;
  config.schedule.weekdays_only = document.getElementById('weekdaysOnly').value === 'true';
  document.querySelectorAll('.time-item input').forEach(input => {
    const market = input.dataset.market;
    const index = parseInt(input.dataset.index);
    if (config.schedule.intraday_rounds[market]) {
      config.schedule.intraday_rounds[market][index] = input.value;
    }
  });

  // 优化器
  config.optimizer = config.optimizer || {};
  config.optimizer.enabled = document.getElementById('optimizerEnabled').value === 'true';
  config.optimizer.lookback_days = parseInt(document.getElementById('lookbackDays').value);
  config.optimizer.risk_free_rate = parseFloat(document.getElementById('riskFreeRate').value);
  config.optimizer.cost_aware = document.getElementById('costAware').value === 'true';

  // AI 自主交易
  config.autonomous = config.autonomous || {};
  config.autonomous.enabled = document.getElementById('autonomousEnabled').value === 'true';
  config.autonomous.auto_execute = document.getElementById('autoExecute').value === 'true';
  config.autonomous.trade_on_catch_up = document.getElementById('tradeOnCatchUp').value === 'true';
  config.autonomous.min_confidence = parseFloat(document.getElementById('minConfidence').value);
  config.autonomous.max_orders_per_cycle = parseInt(document.getElementById('maxOrdersPerCycle').value);
  config.autonomous.max_position_pct = parseFloat(document.getElementById('maxPositionPct').value);
  config.autonomous.max_order_value_pct = parseFloat(document.getElementById('maxOrderValuePct').value);
  config.autonomous.max_cycle_turnover_pct = parseFloat(document.getElementById('maxCycleTurnoverPct').value);
  config.autonomous.universe = {};
  for (const market of ['cn', 'hk', 'us', 'etf']) {
    const symbols = document.getElementById('universe_' + market).value
      .split(',')
      .map(value => value.trim().toUpperCase())
      .filter(Boolean);
    if (symbols.length) config.autonomous.universe[market] = [...new Set(symbols)];
  }

  // 交易
  config.trading = config.trading || {};
  config.trading.mode = document.getElementById('tradingMode').value;
  config.trading.max_daily_trades = parseInt(document.getElementById('maxDailyTrades').value);

  collectCurrentMarketRisk();
  const riskPayload = Object.fromEntries(
    Object.entries(marketConfigs).map(([market, value]) => [market, {risk: value.risk || {}}])
  );

  try {
    const [configRes, marketConfigRes] = await Promise.all([
      fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(config)
      }),
      fetch('/api/market-configs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(riskPayload)
      })
    ]);
    const [configResult, marketConfigResult] = await Promise.all([
      configRes.json(),
      marketConfigRes.json()
    ]);
    if (configRes.ok && marketConfigRes.ok && configResult.ok && marketConfigResult.ok) {
      showToast('✅ 配置已保存', 'success');
    } else {
      showToast('❌ 保存失败: ' + (configResult.error || marketConfigResult.error || '未知错误'), 'error');
    }
  } catch(e) {
    showToast('❌ 保存失败: ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type === 'error' ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

loadConfig();
</script>
