<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场环境研判 - Investment-Auto</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e1e4e8;--text-dim:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--success:#3fb950;--danger:#f85149;--warning:#d29922;--radius:10px;--font:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 span{color:var(--accent)}
.nav{display:flex;gap:12px}
.nav a{color:var(--text-dim);text-decoration:none;font-size:0.9rem;padding:6px 12px;border-radius:6px;transition:all .15s}
.nav a:hover,.nav a.active{color:var(--text);background:rgba(88,166,255,0.1)}
.container{max-width:1000px;margin:0 auto;padding:20px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.section h2{font-size:1rem;margin-bottom:16px;color:var(--accent);display:flex;align-items:center;gap:8px}
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.empty{text-align:center;padding:40px;color:var(--text-dim)}
  /* 市场环境研判样式 */
.macro-content{line-height:1.8;font-size:0.95rem}
.macro-content h1,.macro-content h2,.macro-content h3{color:var(--accent);margin:16px 0 12px}
.macro-content h1{font-size:1.3rem}
.macro-content h2{font-size:1.1rem}
.macro-content h3{font-size:1rem}
.macro-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:0.9rem}
.macro-content th,.macro-content td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.macro-content th{background:rgba(88,166,255,0.1);font-weight:600}
.macro-content ul,.macro-content ol{margin:8px 0;padding-left:24px}
.macro-content li{margin:4px 0}
.macro-content blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:12px 0;color:var(--text-dim)}
.macro-content code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:0.85rem}
.macro-content pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;margin:12px 0}
.macro-content pre code{background:none;padding:0}
/* 标签 */
.tag{display:inline-block;background:rgba(88,166,255,0.15);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:0.75rem;margin-right:6px;margin-bottom:6px}
.tag.positive{background:rgba(63,185,80,0.15);color:var(--success)}
.tag.negative{background:rgba(248,81,73,0.15);color:var(--danger)}
.tag.neutral{background:rgba(139,148,158,0.15);color:var(--text-dim)}
/* 日期选择 */
.date-selector{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.date-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.85rem;color:var(--text-dim);transition:all .15s}
.date-btn:hover,.date-btn.active{border-color:var(--accent);color:var(--text)}
.date-btn.active{background:rgba(88,166,255,0.1)}
</style>
</head>
<body>
<div class="header">
  <h1>🌐 <span>市场环境研判</span></h1>
  <div class="nav">
    <a href="/">💬 对话</a>
    <a href="/dashboard">📊 仪表盘</a>
    <a href="/settings">⚙️ 设置</a>
  </div>
</div>

<div class="container">
  <div class="section">
    <h2>📅 选择日期</h2>
    <div class="date-selector" id="dateSelector">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <div class="section">
    <h2>🧭 市场、政策与板块信号</h2>
    <div id="macroContent">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<script>
let currentDate = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}

function renderMarkdown(value) {
  const html = marked.parse(String(value ?? ''));
  if (globalThis.DOMPurify && typeof globalThis.DOMPurify.sanitize === 'function') {
    return globalThis.DOMPurify.sanitize(html, {USE_PROFILES: {html: true}});
  }
  return escapeHtml(html);
}

async function loadDates() {
  try {
    const res = await fetch('/api/macro/dates');
    const data = await res.json();
    const container = document.getElementById('dateSelector');
    if (!data.dates || data.dates.length === 0) {
      container.innerHTML = '<div class="empty">暂无市场环境数据</div>';
      return;
    }
    container.innerHTML = '';
    data.dates.forEach(date => {
      const btn = document.createElement('div');
      btn.className = 'date-btn' + (date === data.latest ? ' active' : '');
      btn.textContent = date;
      btn.onclick = () => loadReport(date);
      container.appendChild(btn);
    });
    // Load latest
    if (data.latest) loadReport(data.latest);
  } catch(e) {
    document.getElementById('dateSelector').innerHTML = '<div class="empty">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

async function loadReport(date) {
  currentDate = date;
  document.querySelectorAll('.date-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === date);
  });
  
  const container = document.getElementById('macroContent');
  container.innerHTML = '<div class="loading">加载中...</div>';
  
  try {
    const res = await fetch('/api/macro?date=' + encodeURIComponent(date));
    const data = await res.json();
    if (!data.available) {
      container.innerHTML = '<div class="empty">' + escapeHtml(data.message || '暂无数据') + '</div>';
      return;
    }
    // Render markdown
    container.innerHTML = '<div class="macro-content">' + renderMarkdown(data.content || '') + '</div>';
  } catch(e) {
    container.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

loadDates();
</script>
</body>
</html>
