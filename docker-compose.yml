services:
  scheduler:
    build: .
    env_file: .env
    command: ["python", "-m", "src.main", "run"]
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    restart: unless-stopped

  chat:
    build: .
    env_file: .env
    command: ["python", "-m", "src.main", "chat"]
    environment:
      CHAT_HOST: 0.0.0.0
      CHAT_PORT: 8080
      CHAT_OPEN_BROWSER: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    restart: unless-stopped
