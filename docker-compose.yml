services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    command: ["python", "-m", "src.main", "run"]
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      - mongodb

  chat:
    build: .
    env_file: .env
    command: ["python", "-m", "src.main", "chat"]
    environment:
      CHAT_HOST: 0.0.0.0
      CHAT_PORT: 8080
      CHAT_OPEN_BROWSER: "false"
      CHAT_START_SCHEDULER: "false"
      INVESTMENT_AGENT_TRANSPORT: queue
      MONGODB_URI: mongodb://mongodb:27017
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      - mongodb

volumes:
  mongodb-data:
