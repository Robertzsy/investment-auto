[project]
name = "investment-auto"
version = "0.5.0"  # keep in sync with src/version.py
description = "Multi-market paper-trading investment automation with multi-agent research and portfolio optimization"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Investment Auto Contributors"}]
dependencies = [
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "APScheduler>=3.10.4",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic-ai-slim[openai]>=2.0,<3",
  "pymongo>=4.8,<5",
]

[project.scripts]
investment-auto = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
