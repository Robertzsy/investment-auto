app:
  name: investment-auto
  timezone: Asia/Shanghai
  data_dir: runtime/data
  report_dir: runtime/reports
  optimizer_dir: runtime/optimizer
  log_dir: runtime/logs

markets:
  # Choose any subset: cn, hk, us, etf
  enable: [cn, hk, us, etf]

accounts:
  initial_capital: 500000
  currency_map:
    cn: CNY
    hk: HKD
    us: USD
    etf: CNY
  fx_rates:
    USD_CNY: 7.20
    HKD_CNY: 0.92

schedule:
  timezone: Asia/Shanghai
  weekdays_only: true
  # Intraday construction/rebalance rounds are configurable.
  # Increase/decrease this list to change daily intraday build frequency.
  intraday_rounds:
    cn: ["09:30", "10:30", "13:00"]
    hk: ["09:45", "13:20"]
    us: ["21:35", "23:30", "01:00"]
    etf: ["10:00", "10:50", "13:40"]
  close_rounds:
    cn: "15:10"
    hk: "16:10"
    us: "04:10"
    etf: "15:40"
  # APScheduler uses Monday=0. Beijing-time US early-morning jobs therefore
  # run Tue-Sat (1-5), mapping to US Mon-Fri sessions.
  us_early_morning_days: "1-5"
  # Chat is management-only; scheduler and investment worker run independently.
  chat_start_scheduler: false
  catch_up_markets: [cn]
  catch_up_grace_minutes: 480
  macro_daily_time: "08:00"
  macro_timeout_seconds: 240

llm:
  provider: deepseek
  provider_fallback: [openai, glm, kimi]
  models:
    openai:
      model: gpt-5.5
      api_base: https://ai-apigateway.must.edu.mo/openhub/v1
      variants: [gpt-5.5, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
      api_key_env: OPENAI_API_KEY
    deepseek:
      model: deepseek-v4-pro
      api_base: https://api.deepseek.com
      variants: [deepseek-v4-pro, deepseek-v4-flash]
      api_key_env: DEEPSEEK_API_KEY
    glm:
      model: glm-5.2
      api_base: https://open.bigmodel.cn/api/paas/v4
      variants: [glm-5.2]
      api_key_env: GLM_API_KEY
    kimi:
      model: kimi-k3
      api_base: https://api.moonshot.cn/v1
      variants: [kimi-k3]
      api_key_env: KIMI_API_KEY
  role_model_override:
    analyst: deepseek-v4-flash
    researcher: deepseek-v4-flash
    quant_analyst: deepseek-v4-pro
    judge: deepseek-v4-pro
    trader: deepseek-v4-pro
    risk_chairman: deepseek-v4-pro
    technical_analyst: deepseek-v4-flash
    sentiment_analyst: deepseek-v4-flash
    news_analyst: deepseek-v4-flash
    fundamentals_analyst: deepseek-v4-flash
    bull_researcher: deepseek-v4-flash
    bear_researcher: deepseek-v4-flash
    research_manager: deepseek-v4-pro
    investment_advisor: deepseek-v4-pro
    aggressive_analyst: deepseek-v4-pro
    neutral_analyst: deepseek-v4-pro
    conservative_analyst: deepseek-v4-pro
    risk_manager: deepseek-v4-pro
    portfolio_manager: deepseek-v4-pro

optimizer:
  enabled: true
  lookback_days: 120
  samples: 3000
  timeout_seconds: 180
  risk_free_rate: 0.02
  cost_aware: true
  black_litterman_tau: 0.05
  view_confidence: 0.50
  risk_aversion: 2.5
  default_symbols:
    cn: ["600519", "000858", "601318", "600030", "510300", "600036", "000333"]
    hk: ["00700", "09988", "03690", "01299", "00941", "00005", "02800"]
    us: ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "BRK.B", "SPY", "QQQ"]
    etf: ["510300", "510050", "159915", "512100"]
  stress_thresholds:
    var95: -0.03
    max_drawdown: -0.20

# Stock selection runs before the AI committee. Market-wide discovery is
# deterministic and auditable; the LLM may only decide inside the shortlist.
screening:
  enabled: true
  # auto: use MongoDB when MONGODB_URI is configured, otherwise JSON.
  # mongodb: require an attempted local/remote MongoDB connection, with JSON fallback.
  storage:
    backend: auto
    mongodb_uri_env: MONGODB_URI
    mongodb_database: investment_auto
    connect_timeout_ms: 1500
    retry_seconds: 60
  refresh_minutes: 30
  discovery_timeout_seconds: 50
  discovery_limit: 120
  snapshot_limit: 24
  shortlist_size: 8
  use_for_optimizer: true
  optimizer_max_age_minutes: 1440
  min_price:
    cn: 3
    hk: 1
    us: 5
    etf: 0.5
  min_amount:
    cn: 100000000
    hk: 50000000
    us: 20000000
    etf: 50000000
  min_market_cap:
    cn: 5000000000
    hk: 0
    us: 1000000000
    etf: 0
  max_pe: 80
  max_pb: 20
  max_abs_change_pct: 15
  exclude_name_patterns: ["退", "WARRANT", "RIGHT", "UNIT", "PREFERRED"]
  exclude_patterns_by_market:
    cn: ["ST", "*ST"]
    etf: ["货币", "短融", "日利", "现金", "同业存单", "债"]
  weights:
    momentum: 0.28
    trend: 0.22
    liquidity: 0.20
    valuation: 0.12
    volume: 0.10
    low_volatility: 0.08

# Autonomous paper-trading is opt-in in the repository. Set enabled=true only
# after configuring API keys and reviewing the hard limits below.
autonomous:
  enabled: false
  # manual: only one-click complete rounds; automatic: scheduled complete rounds.
  operation_mode: automatic
  auto_execute: true
  trade_on_catch_up: false
  # TradingAgents-CN-inspired staged research. Core design is reimplemented;
  # deterministic risk.py remains the final authority over every order.
  agent_workflow:
    enabled: true
    require_citations: true
    minimum_citations: 1
    # Each security must complete all four independent research domains.
    minimum_base_analysts: 4
    research_debate_rounds: 1
    risk_debate_rounds: 1
    # Each symbol runs its own graph. Keep this bounded to control provider
    # rate limits while still researching two securities concurrently.
    symbol_workers: 2
    max_parallel_workers: 4
    research_data_ttl_minutes: 30
    research_data_timeout_seconds: 12
    json_retries: 1
    memory_enabled: true
    memory_entries_per_role: 6
    memory_chars_per_entry: 1200
    roles:
      technical_analyst: true
      sentiment_analyst: true
      news_analyst: true
      fundamentals_analyst: true
      bull_researcher: true
      bear_researcher: true
      research_manager: true
      trader: true
      aggressive_analyst: true
      neutral_analyst: true
      conservative_analyst: true
      risk_manager: true
      portfolio_manager: true
  # Legacy committee is retained for compatibility when agent_workflow is off.
  committee_roles: [analyst, researcher, quant_analyst, risk_chairman]
  minimum_agent_responses: 2
  min_confidence: 0.65
  max_universe_size: 10
  minimum_priced_symbols: 2
  max_decisions: 10
  max_orders_per_cycle: 3
  max_position_pct: 12
  max_order_value_pct: 8
  max_cycle_turnover_pct: 15
  market_data_workers: 4
  agent_workers: 4
  # A full 8-security graph makes substantially more LLM calls than the old
  # batch committee. This is also the stale-lock safety window.
  cycle_timeout_seconds: 1200
trading:
  mode: paper
  max_daily_trades: 6
  force_build_positions: true
  entry_method: "first 50%, add on -2% pullback, avoid chasing +3% intraday spikes"

notify:
  enabled: true
  channels: [webhook]
  webhook_url_env: NOTIFY_WEBHOOK_URL
  timeout_seconds: 10
